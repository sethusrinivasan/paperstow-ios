name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: PaperstowCore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official image — same path as local `docker run swift:6.0 swift test`.
    # Avoids the third-party setup-swift@v2 installer (now legacy).
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
